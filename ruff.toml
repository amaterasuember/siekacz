include = ["app/**/*.py", "ui/**/*.py", "algorithms/**/*.py", "core/**/*.py", "workers/**/*.py", "import_export/**/*.py", "database/**/*.py", "cad/**/*.py", "main.py"]
[lint]
select = ["E9", "F"]
