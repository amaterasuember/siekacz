name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Verify release tag and app version
        shell: powershell
        run: |
          $versionLine = Select-String -Path app/version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION not found" }
          $version = $versionLine.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match app/version.py ($version)."
          }
          Write-Host "Building verified version $version"

      - name: Build installer
        shell: cmd
        env:
          SIEKACZ_NO_PAUSE: "1"
          SIEKACZ_PYTHON: ${{ env.pythonLocation }}\python.exe
        run: scripts\BUILD_INSTALLER.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIEKACZ9000_Setup
          path: |
            dist/installer/SIEKACZ9000_Setup.exe
            dist/installer/SIEKACZ9000_Setup_v*.exe

      - name: Remove stale installer assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' 2>$null |
            Where-Object { $_ -eq "SIEKACZ9000_Setup.exe" -or $_ -like "SIEKACZ9000_Setup_v*.exe" } |
            ForEach-Object { gh release delete-asset "${{ github.ref_name }}" $_ --yes }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/SIEKACZ9000_Setup_v*.exe
          body_path: RELEASE_NOTES.md
